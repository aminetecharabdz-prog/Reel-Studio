<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F5F8"/><stop offset="0.45" stop-color="#A9AEB8"/><stop offset="0.55" stop-color="#7C828E"/><stop offset="1" stop-color="#E3E6EC"/></linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2D34"/><stop offset="1" stop-color="#0F1013"/></linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1A1C21"/><stop offset="0.5" stop-color="#3A3E47"/><stop offset="1" stop-color="#16181C"/></linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#5B606B"/><stop offset="1" stop-color="#121317"/></radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  </defs>
  <!-- vent clip -->
  <g transform="translate(400 560)">
    <rect x="-34" y="-40" width="68" height="150" rx="16" fill="url(#clip)"/>
    <rect x="-70" y="96" width="44" height="120" rx="12" fill="url(#clip)"/>
    <rect x="26" y="96" width="44" height="120" rx="12" fill="url(#clip)"/>
    <rect x="-70" y="96" width="140" height="22" rx="8" fill="#22252B"/>
    <rect x="-60" y="200" width="20" height="10" rx="4" fill="#E64A4A"/>
  </g>
