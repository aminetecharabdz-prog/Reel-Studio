    <circle r="206" fill="url(#pad)"/>
    <circle r="150" fill="none" stroke="#3A3E48" stroke-width="3"/>
    <circle r="96" fill="none" stroke="#3A3E48" stroke-width="3"/>
    <g fill="#C9CDD6" opacity="0.9">
      <circle cx="0" cy="-122" r="9"/><circle cx="106" cy="-61" r="9"/><circle cx="106" cy="61" r="9"/>
      <circle cx="0" cy="122" r="9"/><circle cx="-106" cy="61" r="9"/><circle cx="-106" cy="-61" r="9"/>
    </g>
    <circle r="40" fill="#1C1E24" stroke="#5A606C" stroke-width="4"/>
    <path d="M-14 -10 L0 -24 L14 -10 M-14 10 L0 24 L14 10" stroke="#C9CDD6" stroke-width="5" fill="none" stroke-linecap="round"/>
