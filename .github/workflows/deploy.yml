name: Build & deploy to GitHub Pages

# Works from ANY branch (Claude Code web sessions push to claude/* branches):
# the build is published to the `gh-pages` branch, which GitHub Pages serves.
on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    if: github.ref != 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Publish dist/ to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA} from ${GITHUB_REF_NAME}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Make sure GitHub Pages serves the gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/${GITHUB_REPOSITORY}/pages)
          echo "pages api: $code"
          if [ "$code" = "404" ]; then
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${GITHUB_REPOSITORY}/pages -d '{"source":{"branch":"gh-pages","path":"/"}}' || true
          fi
      - name: Live URL
        run: echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"

  live-smoke:
    needs: build-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for this commit to be live
        run: |
          URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          for i in $(seq 1 60); do
            live=$(curl -s "$URL/version.json?t=$(date +%s)" | grep -o '"sha":"[^"]*"' || true)
            echo "attempt $i: $live"
            if echo "$live" | grep -q "$GITHUB_SHA"; then exit 0; fi
            sleep 10
          done
          echo "::error::Live site did not update — check Settings → Pages"; exit 1
      - run: npx playwright install --with-deps chromium
      - name: Playwright mobile smoke test on the LIVE URL
        run: npx playwright test --project=live
        env:
          LIVE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-screenshots
          path: test-results/
          retention-days: 7
