name: Fetch photo assets (openly licensed)
on:
  push:
    branches: ['claude/**']
    paths: ['scripts/assets/items.json', 'scripts/assets/fetch.py']
  workflow_dispatch:
    inputs:
      only:
        description: 'space separated item names (empty = all)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install "rembg[cpu]==2.0.67" pillow
      - run: python scripts/assets/fetch.py ${{ github.event.inputs.only || '' }}
      - name: Publish to asset-staging branch
        run: |
          cd staging
          git init -q -b asset-staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "assets from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" asset-staging
