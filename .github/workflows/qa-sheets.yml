name: Visual QA contact sheets

# The Claude build sandbox cannot reach the npm registry, so checks + contact sheets are produced here
# and published to the `qa-sheets` branch (PNG + logs) where the next session can inspect them.
on:
  push:
    branches: ['claude/**']
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qa-sheets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Checks (logged, never stop the sheets)
        run: |
          mkdir -p .qa
          (npm run typecheck > .qa/typecheck.log 2>&1; echo "exit $?" >> .qa/typecheck.log) || true
          (npm run lint > .qa/lint.log 2>&1; echo "exit $?" >> .qa/lint.log) || true
          (npm test > .qa/test.log 2>&1; echo "exit $?" >> .qa/test.log) || true
      - run: npm run build > .qa/build.log 2>&1 || (cat .qa/build.log; true)
      - run: npx playwright install --with-deps chromium
      - name: Contact sheets
        run: |
          npx vite preview --port 4173 --strictPort > /dev/null 2>&1 &
          sleep 4
          export PW_CHROMIUM=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")
          (node scripts/contact-sheet.mjs '' 1.2 > .qa/sheets.log 2>&1) || true
          (node scripts/contact-sheet.mjs '' 0.25 >> .qa/sheets.log 2>&1) || true
          (node scripts/contact-sheet.mjs talking 1.2 >> .qa/sheets.log 2>&1) || true
          true
      - name: Publish to qa-sheets branch
        run: |
          cd .qa
          echo "${GITHUB_SHA} ${GITHUB_REF_NAME} $(date -u +%FT%TZ)" > SHA.txt
          git init -q -b qa-sheets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "QA sheets for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" qa-sheets
